<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/eodiboja-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="고령자를 위한 iM뱅크 인앱 음성 안내 에이전트">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="어디보자">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>어디보자</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --page: #EEF3F2;
      --bezel: #15191C;
      --ink: #39414A;
      --muted: #7C868B;
      --mint: #00C7A9;
    }
    html, body { margin: 0; height: 100%; background: var(--page); }
    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 폰 (기본): 앱이 화면을 꽉 채운다 */
    .stage { position: fixed; inset: 0; }
    .phone { position: absolute; inset: 0; background: #fff; }
    #flutter-host { position: absolute; inset: 0; }
    .loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 15px; letter-spacing: -0.01em;
    }
    body.ready .loading { display: none; }
    .caption { display: none; }

    /* PC·태블릿: 가운데 폰 프레임 안에 앱을 띄운다 */
    @media (min-width: 640px) and (min-height: 700px) {
      .stage {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background:
          radial-gradient(900px 700px at 85% 0%, rgba(0,199,169,.10), transparent 60%),
          radial-gradient(700px 600px at 0% 100%, rgba(226,241,94,.16), transparent 60%),
          var(--page);
      }
      .phone {
        position: relative; inset: auto;
        width: 390px; height: min(844px, calc(100dvh - 120px));
        border: 12px solid var(--bezel); border-radius: 50px; overflow: hidden;
        box-shadow: 0 30px 70px rgba(14, 40, 36, .22), 0 4px 12px rgba(0, 0, 0, .08);
      }
      .caption {
        display: block; text-align: center; line-height: 1.6;
      }
      .caption b { display: block; font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
      .caption span { font-size: 13px; color: var(--muted); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="loading">어디보자를 불러오는 중…</div>
      <div id="flutter-host"></div>
    </div>
    <div class="caption">
      <b>어디보자 · 고령자를 위한 iM뱅크 인앱 음성 안내</b>
      <span>마이크를 허용하면 혼잣말에 반응합니다 · Chrome 권장 · 폰에서 열면 전체 화면으로 보입니다</span>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
